name: CI

on:
    push:
    pull_request:

jobs:
    tests:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4', '8.5']
                deps: [highest, lowest]
                dbal: ['^3.10', '^4.0']
        steps:
            - uses: actions/checkout@v5
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: pcov
            - run: composer require --no-update --no-interaction "doctrine/dbal:${{ matrix.dbal }}"
            - uses: ramsey/composer-install@v3
              with:
                  dependency-versions: ${{ matrix.deps }}
            - run: vendor/bin/phpunit --coverage-clover coverage/clover.xml --log-junit coverage/junit.xml
            - run: vendor/bin/phpstan analyse --no-progress
            - uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: coverage/clover.xml
                  disable_search: true
                  fail_ci_if_error: true
            - uses: codecov/codecov-action@v7
              if: ${{ !cancelled() }}
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  report_type: test_results
                  files: coverage/junit.xml
                  disable_search: true
                  fail_ci_if_error: true

    integration:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                dbal: ['^3.10', '^4.0']
        steps:
            - uses: actions/checkout@v5
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  extensions: pdo_pgsql, pdo_mysql
                  coverage: none
            - run: composer require --no-update --no-interaction "doctrine/dbal:${{ matrix.dbal }}"
            - uses: ramsey/composer-install@v3
            - run: docker compose --profile integration up -d --wait postgres mysql moto
            - run: vendor/bin/phpunit --testsuite integration --log-junit coverage/junit.xml
              env:
                  RDS_AUTH_INTEGRATION_TESTS: '1'
            - uses: codecov/codecov-action@v7
              if: ${{ !cancelled() }}
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  report_type: test_results
                  files: coverage/junit.xml
                  disable_search: true
                  fail_ci_if_error: true
            - run: docker compose --profile integration logs
              if: failure()
